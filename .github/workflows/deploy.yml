name: Deploy to Hostinger

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, pdo_mysql, pdo_sqlite, gd, zip, fileinfo
          coverage: none

      - name: Install composer dependencies (production)
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-progress

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: laravel-app
          path: |
            *
            !node_modules
            !tests
            !.github
            !.vscode
            !public/storage
          retention-days: 1
          include-hidden-files: true

  deploy:
    name: Deploy to Hostinger
    runs-on: ubuntu-latest
    needs: build
    env:
      SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: laravel-app
          path: app

      - name: Stage public folder for public_html
        run: |
          mkdir -p staging
          cp -r app/public staging/public
          # index.php টা public_html থেকে laravel-app ফোল্ডারের ভেতরের কোড point করে
          sed -e "s|'/../vendor|'/../laravel-app/vendor|" \
              -e "s|'/../bootstrap|'/../laravel-app/bootstrap|" \
              -e "s|'/../storage|'/../laravel-app/storage|" \
              app/public/index.php > staging/public/index.php
          php -l staging/public/index.php

      # ---- FTP ধীর ও অনির্ভরযোগ্য (১০k+ file এ server connection কেটে দেয়),
      # তাই একটাই tarball SSH (SCP) দিয়ে পাঠানো হয় ----
      - name: Package application (single tarball)
        run: |
          mv app laravel-app
          mv staging/public public_html-pkg
          tar -czf deploy.tar.gz laravel-app public_html-pkg
          du -h deploy.tar.gz

      - name: Upload tarball via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.FTP_SERVER }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "deploy.tar.gz"
          target: /home/${{ secrets.FTP_USERNAME }}/

      # ---- Extract + public_html swap + .env (প্রথমবার) + migration + cache ----
      - name: Extract, activate and optimize (SSH)
        if: env.SSH_PASSWORD != ''
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.FTP_SERVER }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script_stop: true
          script: |
            cd /home/${{ secrets.FTP_USERNAME }}/domains/${{ secrets.FTP_DOMAIN }}
            rm -rf laravel-app/vendor laravel-app/bootstrap/cache/*.php
            tar -xzf ~/deploy.tar.gz
            mkdir -p public_html
            find public_html -mindepth 1 -maxdepth 1 ! -name storage -exec rm -rf {} +
            cp -a public_html-pkg/. public_html/
            rm -rf public_html-pkg
            cd laravel-app
            if [ ! -f .env ]; then
            cat > .env <<'ENVEOF'
            APP_NAME="SRG Passport"
            APP_ENV=production
            APP_DEBUG=false
            APP_URL=https://${{ secrets.FTP_DOMAIN }}
            APP_LOCALE=en
            APP_FALLBACK_LOCALE=en
            APP_MAINTENANCE_DRIVER=file
            APP_MAINTENANCE_STORE=database
            BCRYPT_ROUNDS=12
            LOG_CHANNEL=stack
            LOG_STACK=single
            LOG_LEVEL=error
            DB_CONNECTION=mysql
            DB_HOST=127.0.0.1
            DB_PORT=3306
            DB_DATABASE=u831232111_pms321
            DB_USERNAME=u831232111_pms321
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            SESSION_DRIVER=database
            SESSION_LIFETIME=120
            SESSION_PATH=/
            SESSION_DOMAIN=null
            SESSION_ENCRYPT=false
            BROADCAST_CONNECTION=log
            FILESYSTEM_DISK=public
            QUEUE_CONNECTION=database
            CACHE_STORE=database
            MAIL_MAILER=log
            MAIL_FROM_ADDRESS=no-reply@${{ secrets.FTP_DOMAIN }}
            ENVEOF
            fi
            grep -q "^APP_KEY=base64" .env || php artisan key:generate --force
            php artisan migrate --force
            # Demo dashboard content + starter roles — seeders skip when data exists.
            php artisan db:seed --class=RolesSeeder --force
            php artisan db:seed --class=DemoContentSeeder --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            rm -f ~/deploy.tar.gz
